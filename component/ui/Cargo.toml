[package]
name = "easy_busy_chat_ui"
version = "0.6.1"
edition = "2021"

[lib]
name = "easy_busy_chat_ui"
# The Windows add-in embeds EasyBusyUI.exe; the library is only used by that binary.
crate-type = ["rlib"]

[[bin]]
name = "EasyBusyUI"
path = "src/main.rs"

[dependencies]
easy_busy_chat_ipc_protocol = { path = "../ipc_protocol" }
tauri = { version = "2", features = ["webview-data-url", "devtools"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Networking_WinHttp",
] }

[build-dependencies]
tauri-build = { version = "2" }
