[package]
name = "easy_busy_chat_addin"
version = "0.6.1"
edition = "2021"

[lib]
name = "EasyBusyChat"
crate-type = ["cdylib"]

[dependencies]
native_api_1c = { path = "../native_api_1c/native_api_1c" }
easy_busy_chat_ipc_protocol = { path = "../ipc_protocol" }
utf16_lit = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
parking_lot = "0.12"
once_cell = "1"
sha2 = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
] }

[build-dependencies]
anyhow = { workspace = true }
embed-resource = "2"
