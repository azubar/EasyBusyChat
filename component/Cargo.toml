[workspace]
members = ["addin", "ipc_protocol", "ui", "native_api_1c/native_api_1c", "native_api_1c/native_api_1c_core", "native_api_1c/native_api_1c_macro"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"       # optimize for size
lto = true            # Link-Time Optimization
strip = true          # strip debug symbols
codegen-units = 1     # maximize optimization
panic = "unwind"       # safer for DLL (prevent crash of host process)
